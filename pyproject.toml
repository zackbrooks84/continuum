[project]
name = "continuum"
version = "0.1.0"
description = "Async task queue + persistent work continuity for AI agents — push tasks, run offline, checkpoint reasoning/decisions/next-steps, resume without re-explaining context. Built for Claude Code + MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "claude", "ai-agents", "task-queue", "continuity", "checkpoint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=0.9.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-benchmark>=4.0.0"]
ui  = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
remote = ["anyio>=4.0.0"]

[project.scripts]
continuum = "continuum.cli:cli"

[project.urls]
Homepage = "https://github.com/zackbrooks84/continuum"
Repository = "https://github.com/zackbrooks84/continuum"
Issues = "https://github.com/zackbrooks84/continuum/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pytest.benchmark]
autosave = true
sort = "mean"
